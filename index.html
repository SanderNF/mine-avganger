<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mine avganger</title>
<meta name="description" content="Din egen sanntids avgangstavle for tog, T-bane, trikk, buss og båt i Norge, med data fra Entur.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #e7ebef;
    --panel: #ffffff;
    --ink: #0e1a2b;
    --muted: #5a6779;
    --rule: #dbe0e6;
    --rule-input: #b8c2cd;
    --field: #f6f8fa;
    --hover: #e6edfb;
    --band-bg: #0e1a2b;
    --band-ink: #ffffff;
    --accent: #1d4ed8;
    --accent-ink: #ffffff;
    --now: #ffd23f;
    --now-ink: #0e1a2b;
    --late: #b45309;
    --danger: #c8102e;
    --font: "Barlow Semi Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0a1424;
      --panel: #12223a;
      --ink: #eef2f7;
      --muted: #97a6ba;
      --rule: #22364f;
      --rule-input: #3a5170;
      --field: #0d1a2e;
      --hover: #1d3352;
      --band-bg: #1c3355;
      --band-ink: #ffffff;
      --accent: #7aa2ff;
      --accent-ink: #0a1424;
      --late: #fbbf24;
      --danger: #ff6b7d;
      color-scheme: dark;
    }
  }

  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: 17px;
    line-height: 1.35;
    font-variant-numeric: tabular-nums;
    min-height: 100vh;
  }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Header */
  /* Full-width dark band with the Oslo S clock tower fading in from the right. Header text is
     always light on it, whatever the theme. */
  .top {
    --ink: #ffffff; --muted: rgba(255, 255, 255, 0.72); --accent: #7aa2ff; --accent-ink: #0a1424;
    color: var(--ink);
    display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px;
    margin: 0 0 20px;
    padding: 34px max(clamp(16px, 4vw, 40px), calc((100% - 1440px) / 2 + 40px)) 26px;
    background:
      linear-gradient(90deg, #05070b 0%, #05070b 30%, rgba(5, 7, 11, 0.55) 62%, rgba(5, 7, 11, 0.1) 100%),
      url("IMGs/clock-tower.jpg") right 4% top 24% / 520px auto no-repeat,
      #05070b;
  }
  @media (max-width: 640px) {
    .top { background-size: auto, 380px auto, auto; background-position: 0 0, right -60px top 22%, 0 0; }
  }
  .title { margin: 0; font-size: clamp(1.7rem, 3.2vw, 2.4rem); font-weight: 700; line-height: 1.05; letter-spacing: -0.01em; }
  body.editing .title { outline: 2px dashed var(--accent); outline-offset: 5px; border-radius: 2px; cursor: text; }
  .date { margin: 6px 0 0; color: var(--muted); font-size: 1.05rem; }
  .test-mode {
    display: inline-block; margin: 10px 0 0; padding: 3px 10px; border-radius: 4px;
    background: var(--now); color: var(--now-ink); font-size: 0.95rem; font-weight: 600;
  }
  .top-right { display: flex; align-items: center; gap: 22px; }
  .clock { font-size: clamp(2.2rem, 5vw, 3.4rem); font-weight: 600; line-height: 1; letter-spacing: -0.01em; }
  .clock .sec { color: var(--muted); font-size: 0.5em; font-weight: 500; margin-left: 2px; }

  .btn { border: 1.5px solid var(--ink); background: transparent; border-radius: 6px; padding: 8px 16px; font-weight: 600; cursor: pointer; }
  a.btn { display: inline-block; text-decoration: none; }
  .btn.primary, .btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.primary:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn.ghost { border-color: transparent; }

  /* Grid of boards */
  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr));
    gap: 20px; align-items: start;
    max-width: 1440px; margin: 0 auto; padding: 6px clamp(16px, 4vw, 40px) 48px;
  }
  @media (min-width: 840px) { .board.wide { grid-column: span 2; } }
  .empty { grid-column: 1 / -1; color: var(--muted); text-align: center; padding: 48px 0; margin: 0; }

  .board { background: var(--panel); border-radius: 8px; overflow: hidden; }
  body.editing .board { outline: 2px dashed var(--rule-input); outline-offset: 3px; cursor: grab; }
  .board.dragging { opacity: 0.4; }
  .board.drop-target { outline-color: var(--accent) !important; outline-style: solid !important; }

  .band {
    background: var(--band-bg); color: var(--band-ink);
    display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
    padding: 14px 18px;
  }
  .board-title { margin: 0; font-size: 1.5rem; font-weight: 700; line-height: 1.1; }
  .board-sub { margin: 4px 0 0; font-size: 0.95rem; opacity: 0.8; }
  .tools { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
  .tool {
    background: transparent; color: var(--band-ink);
    border: 1px solid rgba(255, 255, 255, 0.45); border-radius: 5px;
    padding: 3px 10px; font-size: 0.95rem; font-weight: 600; cursor: pointer;
  }
  .tool:disabled { opacity: 0.3; cursor: default; }
  .tool.armed { background: var(--danger); border-color: var(--danger); color: #fff; }

  .cols, .row {
    display: grid; grid-template-columns: 3.4em minmax(0, 1fr) 2.6em 4.8em;
    gap: 12px; align-items: baseline; padding-left: 18px; padding-right: 18px;
  }
  .cols { font-size: 0.82rem; color: var(--muted); padding-top: 10px; padding-bottom: 6px; border-bottom: 1px solid var(--rule); }
  .cols span:nth-child(3) { text-align: center; }
  .cols span:last-child { text-align: right; }
  .rows { list-style: none; margin: 0; padding: 0; }
  .row { padding-top: 11px; padding-bottom: 11px; border-bottom: 1px solid var(--rule); font-size: 1.15rem; }
  .row:last-child { border-bottom: 0; }
  .badge {
    justify-self: start; min-width: 2.9em; text-align: center;
    padding: 2px 6px; border-radius: 4px; color: #fff; font-weight: 700; font-size: 0.95rem; line-height: 1.35;
  }
  .dest { font-weight: 500; overflow-wrap: anywhere; }
  .note { display: block; font-size: 0.82rem; font-weight: 400; color: var(--muted); }
  .plat { text-align: center; font-weight: 600; }
  .time { text-align: right; font-weight: 700; white-space: nowrap; }
  .time.now .t-main { background: var(--now); color: var(--now-ink); padding: 1px 8px; border-radius: 4px; }
  .time .late { color: var(--late); }
  .time.cancelled { color: var(--danger); }
  .is-cancelled { text-decoration: line-through; opacity: 0.6; }
  .board-msg { margin: 0; padding: 24px 18px; color: var(--muted); }
  .board-meta { margin: 0; padding: 8px 18px 12px; font-size: 0.82rem; color: var(--muted); border-top: 1px solid var(--rule); }

  .add-tile {
    min-height: 200px; border: 2px dashed var(--rule-input); border-radius: 8px; background: transparent;
    color: var(--muted); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    font-weight: 600; font-size: 1.1rem; cursor: pointer;
  }
  .add-tile:hover { border-color: var(--accent); color: var(--accent); }
  .add-tile .plus { font-size: 2.4rem; line-height: 1; font-weight: 500; }

  /* Editor dialog */
  .editor {
    width: min(560px, calc(100% - 24px)); max-height: calc(100dvh - 24px);
    border: 0; border-radius: 10px; padding: 0; background: var(--panel); color: var(--ink);
  }
  .editor[open] { display: flex; flex-direction: column; }
  .editor::backdrop { background: rgba(5, 12, 24, 0.55); }
  .editor-inner { padding: 22px 22px 6px; overflow: auto; }
  .editor h2 { margin: 0 0 18px; font-size: 1.6rem; line-height: 1.1; }
  .field { margin: 0 0 18px; padding: 0; border: 0; min-width: 0; }
  .field > label, .field > legend { display: block; font-weight: 600; margin: 0 0 6px; padding: 0; }
  .opt { font-weight: 400; color: var(--muted); }
  .field input, .field select {
    width: 100%; padding: 10px 12px; border: 1px solid var(--rule-input); border-radius: 6px; background: var(--field);
  }
  .combo-box { position: relative; }
  .results {
    position: absolute; top: 100%; left: 0; right: 0; z-index: 5;
    margin: 4px 0 0; padding: 4px; list-style: none; max-height: 260px; overflow: auto;
    background: var(--panel); border: 1px solid var(--rule-input); border-radius: 6px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
  }
  .results li { display: flex; justify-content: space-between; gap: 12px; padding: 9px 10px; border-radius: 4px; cursor: pointer; }
  .results li:hover, .results li[aria-selected="true"] { background: var(--hover); }
  .results small { color: var(--muted); text-align: right; font-size: 0.88rem; }
  .hint { margin: 6px 0 0; font-size: 0.9rem; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { padding: 5px 12px; border: 1px solid var(--rule-input); border-radius: 999px; background: transparent; font-size: 0.98rem; font-weight: 500; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .field-label { display: block; font-weight: 600; margin: 0 0 6px; }
  .line-dests { display: grid; gap: 8px; }
  .ld-row { display: grid; grid-template-columns: 4.5em minmax(0, 1fr); gap: 10px; align-items: center; }
  .ld-code { font-weight: 700; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .editor-actions { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 22px; border-top: 1px solid var(--rule); }

  /* Travel chains */
  .trip { padding: 12px 18px; border-bottom: 1px solid var(--rule); }
  .trip:last-child { border-bottom: 0; }
  .trip-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 1.15rem; }
  .trip-span b { font-weight: 700; }
  .trip-legs { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 6px; }
  .leg-step { display: grid; grid-template-columns: 3.4em minmax(0, 1fr) auto; gap: 12px; align-items: baseline; }
  .leg-step .plat { color: var(--muted); font-size: 0.9rem; white-space: nowrap; }
  .leg-step .late { color: var(--late); font-weight: 600; }
  .walk-step { padding-left: calc(3.4em + 12px); font-size: 0.9rem; color: var(--muted); }
  .leg-edit { border: 1px solid var(--rule-input); border-radius: 8px; padding: 14px 14px 0; margin: 0 0 14px; }
  .leg-edit-head { display: flex; justify-content: space-between; align-items: center; margin: 0 0 12px; }
  .leg-edit h4 { margin: 0; font-size: 1.15rem; }
  .btn.small { padding: 3px 10px; font-size: 0.95rem; }
  .field input.walk-input { width: 7em; }
  .add-leg, .add-route { margin: 0 0 20px; }
  .route-edit + .route-edit { border-top: 1px solid var(--rule); padding-top: 18px; }
  .route-head { display: flex; justify-content: space-between; align-items: center; margin: 0 0 12px; }
  .route-head h3 { margin: 0; font-size: 1.3rem; }
</style>
</head>
<body>
  <header class="top">
    <div>
      <h1 class="title" spellcheck="false">Mine avganger</h1>
      <p class="date"></p>
      <p class="test-mode" hidden></p>
    </div>
    <div class="top-right">
      <div class="clock" aria-hidden="true"><span class="hm"></span><span class="sec"></span></div>
      <a class="btn repo-link" target="_blank" rel="noopener" hidden>GitHub</a>
      <button type="button" class="btn edit-toggle" aria-pressed="false">Rediger</button>
    </div>
  </header>

  <main class="grid" aria-label="Avgangstavler"></main>

  <dialog class="editor" aria-labelledby="editor-heading">
    <div class="editor-inner">
      <h2 id="editor-heading">Ny tavle</h2>

      <div class="stop-slot"></div>

      <div class="field">
        <label for="title-input">Navn på tavla <span class="opt">(valgfritt)</span></label>
        <input id="title-input" type="text" placeholder="For eksempel «Til jobb»">
      </div>

      <fieldset class="field" data-kind="modes" hidden><legend>Transport</legend><div class="chips"></div></fieldset>
      <fieldset class="field" data-kind="lines" hidden><legend>Linjer</legend><div class="chips"></div></fieldset>
      <div class="field" data-linedest hidden>
        <span class="field-label">Retning per linje</span>
        <div class="line-dests"></div>
      </div>
      <fieldset class="field" data-kind="platforms" hidden><legend>Spor og plattformer</legend><div class="chips"></div></fieldset>
      <p class="hint" id="filter-hint" style="margin: -8px 0 18px;"></p>

      <div class="field-row">
        <div class="field">
          <label for="rows-select">Antall avganger</label>
          <select id="rows-select">
            <option value="5">5</option><option value="8">8</option><option value="12">12</option><option value="20">20</option>
          </select>
        </div>
        <div class="field">
          <label for="width-select">Bredde</label>
          <select id="width-select"><option value="normal">Vanlig</option><option value="wide">Bred</option></select>
        </div>
      </div>
    </div>
    <div class="editor-actions">
      <button type="button" class="btn ghost" data-act="cancel">Avbryt</button>
      <button type="button" class="btn primary" data-act="save">Lagre tavle</button>
    </div>
  </dialog>

  <dialog class="editor chain-editor" aria-labelledby="chain-heading">
    <div class="editor-inner">
      <h2 id="chain-heading">Ny reise</h2>
      <p class="hint" style="margin: -10px 0 18px;">Sett sammen etappene du pleier å ta. Tavla viser de neste reisene der overgangene rekker å gå opp, med sanntid for hver etappe.</p>

      <div class="field">
        <label for="chain-title">Navn på reisen <span class="opt">(valgfritt)</span></label>
        <input id="chain-title" type="text" placeholder="For eksempel «Til jobb»">
      </div>

      <div class="routes-edit"></div>
      <button type="button" class="btn add-route">+ Legg til alternativ rute</button>

      <div class="field" data-sort hidden>
        <label for="chain-sort">Sorter reisene etter</label>
        <select id="chain-sort">
          <option value="arrival">Ankomst, først fremme øverst</option>
          <option value="departure">Avgang, går først øverst</option>
        </select>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="chain-rows">Antall reiser</label>
          <select id="chain-rows">
            <option value="3">3</option><option value="5">5</option><option value="8">8</option>
          </select>
        </div>
        <div class="field">
          <label for="chain-width">Bredde</label>
          <select id="chain-width"><option value="normal">Vanlig</option><option value="wide">Bred</option></select>
        </div>
      </div>
    </div>
    <div class="editor-actions">
      <button type="button" class="btn ghost" data-act="cancel">Avbryt</button>
      <button type="button" class="btn primary" data-act="save">Legg til reise</button>
    </div>
  </dialog>

<script>
(() => {
  // Entur ber alle brukere sende et navn på formen firma-applikasjon.
  const CLIENT_NAME = "privat-avgangstavle";
  const JOURNEY_PLANNER = "https://api.entur.io/journey-planner/v3/graphql";
  const GEOCODER = "https://api.entur.io/geocoder/v1/autocomplete";
  const STORE_KEY = "mine-avganger:v1";
  const REFRESH_MS = 30000;
  // Lenke til GitHub-repoet. På GitHub Pages finnes den automatisk; ellers fyll inn her,
  // f.eks. "https://github.com/brukernavn/mine-avganger". Tomt = knappen skjules.
  const REPO_URL = "https://github.com/sandernf/mine-avganger";

  // Testing: ?nday=3 shows the departures and clock three days from now, using planned times.
  const DAY_OFFSET = (() => {
    const days = Math.trunc(Number(new URLSearchParams(location.search).get("nday")));
    return Number.isFinite(days) ? Math.min(Math.max(days, 0), 365) : 0;
  })();
  const now = () => Date.now() + DAY_OFFSET * 86400000;
  // Entur's startTime; left out (null) when live, so Entur uses its own "now".
  const startTime = () => DAY_OFFSET ? new Date(now()).toISOString() : null;

  const MODES = {
    rail: { name: "Tog", color: "#00824a" },
    metro: { name: "T-bane", color: "#d9640a" },
    tram: { name: "Trikk", color: "#0b78c8" },
    bus: { name: "Buss", color: "#d40d0d" },
    coach: { name: "Ekspressbuss", color: "#5a7d00" },
    water: { name: "Båt", color: "#682c88" },
    air: { name: "Fly", color: "#4b5563" },
  };
  const MODE_ORDER = Object.keys(MODES);
  const CATEGORY_MODE = {
    railStation: "rail", metroStation: "metro", tramStation: "tram", onstreetTram: "tram",
    busStation: "bus", onstreetBus: "bus", coachStation: "coach",
    ferryStop: "water", harbourPort: "water", ferryPort: "water", airport: "air",
  };

  const QUERY = `query ($id: String!, $n: Int!, $start: DateTime) {
    stopPlace(id: $id) {
      name
      estimatedCalls(startTime: $start, numberOfDepartures: $n, timeRange: 43200) {
        aimedDepartureTime
        expectedDepartureTime
        realtime
        cancellation
        date
        destinationDisplay { frontText }
        quay { publicCode }
        serviceJourney { id line { id publicCode transportMode } }
        situations { summary { value language } }
      }
    }
  }`;

  // Travel chains work on places: the chosen stop plus other stops within NEARBY_M metres, so that
  // "Oslo S" also covers the trams at Jernbanetorget. Lines come from Entur's route data.
  const NEARBY_M = 250;
  const PLACE_QUERY = `query ($id: String!) {
    stopPlace(id: $id) { id name latitude longitude quays { lines { id publicCode } } }
  }`;
  const NEARBY_QUERY = `query ($lat: Float!, $lon: Float!, $d: Float!) {
    nearest(latitude: $lat, longitude: $lon, maximumDistance: $d, filterByPlaceTypes: [stopPlace], multiModalMode: parent, first: 20) {
      edges { node { place { ... on StopPlace { id name quays { lines { id publicCode } } } } } }
    }
  }`;
  // Calls on a leg's lines at one stop: departures where you get on, arrivals where you get off.
  // A departure is matched to its arrival by serviceJourney id and service date.
  const LEG_QUERY = `query ($id: String!, $lines: [ID!], $ad: ArrivalDeparture!, $n: Int!, $start: DateTime) {
    stopPlace(id: $id) {
      estimatedCalls(startTime: $start, numberOfDepartures: $n, timeRange: 43200, arrivalDeparture: $ad, whiteListed: { lines: $lines }) {
        date
        aimedDepartureTime
        expectedDepartureTime
        aimedArrivalTime
        expectedArrivalTime
        cancellation
        quay { publicCode }
        serviceJourney { id line { id publicCode transportMode } }
        situations { summary { value language } }
      }
    }
  }`;

  // ---------- helpers ----------
  const $ = (sel, el = document) => el.querySelector(sel);
  function h(tag, props = {}, ...children) {
    const el = document.createElement(tag);
    for (const [key, value] of Object.entries(props)) {
      if (value === false || value == null) continue;
      if (key === "class") el.className = value;
      else if (key === "text") el.textContent = value;
      else if (key.startsWith("on")) el.addEventListener(key.slice(2), value);
      else el.setAttribute(key, value === true ? "" : value);
    }
    el.append(...children.filter(c => c != null && c !== false));
    return el;
  }
  const uid = () => Math.random().toString(36).slice(2, 10);
  const clock = date => date.toLocaleTimeString("nb-NO", { hour: "2-digit", minute: "2-digit" });
  const byNatural = (a, b) => a.localeCompare(b, "nb", { numeric: true });
  const lineCode = call => (call.serviceJourney?.line?.publicCode || "").toUpperCase();
  const modeOf = call => call.serviceJourney?.line?.transportMode || "";
  const platformOf = call => call.quay?.publicCode || "";
  const destOf = call => (call.destinationDisplay?.frontText || "").trim();
  const tripKey = call => (call.serviceJourney?.id || "") + "|" + (call.date || "");

  function passes(call, f, skip) {
    if (skip !== "modes" && f.modes.length && !f.modes.includes(modeOf(call))) return false;
    if (skip !== "lines" && f.lines.length && !f.lines.includes(lineCode(call))) return false;
    if (skip !== "lines" && f.lineDest[lineCode(call)] && f.lineDest[lineCode(call)] !== destOf(call)) return false;
    if (skip !== "platforms" && f.platforms.length && !f.platforms.includes(platformOf(call))) return false;
    return true;
  }

  // ---------- config ----------
  function newBoard(overrides = {}) {
    return { id: uid(), stopId: "", stopName: "", title: "", modes: [], lines: [], platforms: [], rows: 8, wide: false, ...overrides,
      lineDest: { ...(overrides.lineDest || {}) } };
  }
  // A travel chain: legs taken one after another, each from one stop to another on chosen lines,
  // with `walk` minutes before it (to the first stop, or to change from the previous leg).
  function newLeg(overrides = {}) {
    return { id: uid(), fromId: "", fromName: "", toId: "", toName: "", walk: 0, ...overrides, lines: [...(overrides.lines || [])] };
  }
  // A route is one way to make the trip; `walkEnd` is the walk from its last stop to the destination.
  function newRoute(overrides = {}) {
    const legs = (overrides.legs?.length ? overrides.legs : [{}]).map(newLeg);
    return { id: uid(), walkEnd: 0, ...overrides, legs };
  }
  // A travel board holds one or more alternative routes, sorted together by arrival or departure.
  // Older saves kept a single route's legs directly on the chain.
  function newChain(overrides = {}) {
    const { legs, ...rest } = overrides;
    const routes = (rest.routes?.length ? rest.routes : [{ legs }]).map(newRoute);
    return { id: uid(), kind: "chain", title: "", rows: 5, wide: false, sort: "arrival", ...rest, routes };
  }
  const allLegs = chain => chain.routes.flatMap(r => r.legs);
  const restoreItem = item => item?.kind === "chain" ? newChain(item) : newBoard(item);

  function loadConfig() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORE_KEY));
      if (saved && Array.isArray(saved.boards)) return { title: saved.title || "Mine avganger", boards: saved.boards.map(restoreItem) };
    } catch {}
    return { title: "Mine avganger", boards: [newBoard({ stopId: "NSR:StopPlace:337", stopName: "Oslo S" })] };
  }
  function saveConfig() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(config)); } catch {}
  }
  let config = loadConfig();

  // ---------- data ----------
  const stops = new Map(); // stopId -> { name, calls, updated, error }

  async function fetchStop(id) {
    const entry = stops.get(id) || { name: "", calls: [], updated: null, error: "" };
    stops.set(id, entry);
    try {
      const response = await fetch(JOURNEY_PLANNER, {
        method: "POST",
        headers: { "Content-Type": "application/json", "ET-Client-Name": CLIENT_NAME },
        body: JSON.stringify({ query: QUERY, variables: { id, n: 200, start: startTime() } }),
      });
      const json = await response.json();
      const stop = json.data?.stopPlace;
      if (!stop) throw new Error(json.errors?.[0]?.message || "fant ikke stoppestedet");
      entry.name = stop.name;
      entry.calls = stop.estimatedCalls || [];
      entry.updated = new Date();
      entry.error = "";
    } catch (error) {
      entry.error = "Fikk ikke hentet avganger (" + error.message + "). Prøver igjen om litt.";
    }
    return entry;
  }

  async function gql(query, variables) {
    const response = await fetch(JOURNEY_PLANNER, {
      method: "POST",
      headers: { "Content-Type": "application/json", "ET-Client-Name": CLIENT_NAME },
      body: JSON.stringify({ query, variables }),
    });
    const json = await response.json();
    if (!json.data) throw new Error(json.errors?.[0]?.message || "ugyldig svar");
    return json.data;
  }

  const places = new Map(); // stopId -> { members: [{ id, name, lines: Map(lineId -> code) }] } or { error }
  const placeLoads = new Map(); // stopId -> promise, so each place is looked up once
  const memberOf = stop => ({ id: stop.id, name: stop.name,
    lines: new Map((stop.quays || []).flatMap(q => q.lines || []).map(l => [l.id, (l.publicCode || "").toUpperCase()])) });

  function loadPlace(id) {
    if (!placeLoads.has(id)) {
      placeLoads.set(id, (async () => {
        try {
          const { stopPlace } = await gql(PLACE_QUERY, { id });
          if (!stopPlace) throw new Error("fant ikke stoppestedet");
          const { nearest } = await gql(NEARBY_QUERY, { lat: stopPlace.latitude, lon: stopPlace.longitude, d: NEARBY_M });
          const members = [memberOf(stopPlace)];
          for (const edge of nearest?.edges || []) {
            const stop = edge.node?.place;
            if (stop?.id && stop.quays && !members.some(m => m.id === stop.id)) members.push(memberOf(stop));
          }
          places.set(id, { members });
        } catch (error) {
          placeLoads.delete(id); // try again on the next refresh
          places.set(id, { error: "Fikk ikke hentet stoppestedet (" + error.message + "). Prøver igjen om litt." });
        }
      })());
    }
    return placeLoads.get(id);
  }

  // Lines (id -> code) that serve both ends of a leg, whatever the time of day. Unless `all` is set,
  // only the leg's chosen lines. Null until both places are loaded.
  function legLines(leg, all = false) {
    const from = places.get(leg.fromId)?.members;
    const to = places.get(leg.toId)?.members;
    if (!from || !to) return null;
    const toLines = new Set(to.flatMap(m => [...m.lines.keys()]));
    const lines = new Map();
    for (const member of from) {
      for (const [id, code] of member.lines) {
        if (toLines.has(id) && (all || !leg.lines.length || leg.lines.includes(code))) lines.set(id, code);
      }
    }
    return lines;
  }

  const legCalls = new Map(); // request key -> { calls, updated, error }

  // What a leg needs: departures at each stop of its start served by its lines, and arrivals at each
  // such stop of its end. Null until both places are loaded.
  function legRequests(leg) {
    const lines = legLines(leg);
    if (!lines) return null;
    const ids = [...lines.keys()].sort();
    const requests = [];
    for (const [ad, placeId] of [["departures", leg.fromId], ["both", leg.toId]]) {
      for (const member of places.get(placeId).members) {
        const served = ids.filter(id => member.lines.has(id));
        if (served.length) requests.push({ ad, stopId: member.id, name: member.name, ids: served,
          key: ad + "|" + member.id + "|" + served.join(",") });
      }
    }
    return requests;
  }

  async function fetchLegCalls({ ad, stopId, ids, key }) {
    const entry = legCalls.get(key) || { calls: [], updated: null, error: "" };
    legCalls.set(key, entry);
    try {
      const { stopPlace } = await gql(LEG_QUERY, { id: stopId, lines: ids, ad, n: 200, start: startTime() });
      if (!stopPlace) throw new Error("fant ikke stoppestedet");
      entry.calls = stopPlace.estimatedCalls || [];
      entry.updated = new Date();
      entry.error = "";
    } catch (error) {
      entry.error = "Fikk ikke hentet avganger (" + error.message + "). Prøver igjen om litt.";
    }
  }

  // Departures on a leg that reach its end, as { call, dep, arr, fromName, toName }, sorted by
  // departure. Returns { opts } once loaded, otherwise { error } (empty while still loading).
  function legOptions(leg) {
    const placeError = [places.get(leg.fromId), places.get(leg.toId)].find(p => p?.error)?.error;
    if (placeError) return { error: placeError };
    const requests = legRequests(leg);
    if (!requests) return { error: "" };
    const loaded = requests.map(r => ({ ...r, entry: legCalls.get(r.key) }));
    const missing = loaded.find(r => !r.entry?.updated);
    if (missing) return { error: missing.entry?.error || "" };

    const ends = new Map(); // tripKey -> [{ call, name }] where you can get off
    for (const r of loaded.filter(r => r.ad === "both")) {
      for (const call of r.entry.calls) {
        if (!ends.has(tripKey(call))) ends.set(tripKey(call), []);
        ends.get(tripKey(call)).push({ call, name: r.name });
      }
    }
    const seen = new Set();
    const opts = [];
    for (const r of loaded.filter(r => r.ad === "departures")) {
      for (const call of r.entry.calls) {
        if (call.cancellation || seen.has(tripKey(call))) continue;
        const dep = new Date(call.expectedDepartureTime);
        const end = (ends.get(tripKey(call)) || [])
          .map(e => ({ ...e, arr: new Date(e.call.expectedArrivalTime || e.call.expectedDepartureTime) }))
          .filter(e => !e.call.cancellation && e.arr > dep)
          .sort((a, b) => a.arr - b.arr)[0];
        if (!end) continue;
        seen.add(tripKey(call));
        opts.push({ call, dep, arr: end.arr, fromName: r.name, toName: end.name });
      }
    }
    return { opts: opts.sort((a, b) => a.dep - b.dep) };
  }

  // Chains every first-leg departure with the earliest connection that can be reached on each later
  // leg. When several first departures lead to the same final trip, only the latest one is kept.
  function findTrips(route, opts) {
    const earliest = now() - 60000;
    const firstWalk = (route.legs[0].walk || 0) * 60000;
    const byFinal = new Map();
    for (const first of opts[0]) {
      if (first.dep - firstWalk < earliest) continue;
      const path = [first];
      for (let i = 1; i < opts.length; i++) {
        const ready = path[i - 1].arr.getTime() + (route.legs[i].walk || 0) * 60000;
        const next = opts[i].find(o => o.dep >= ready);
        if (!next) break;
        path.push(next);
      }
      if (path.length === opts.length) byFinal.set(tripKey(path.at(-1).call), path);
    }
    return [...byFinal.values()].sort((a, b) => a[0].dep - b[0].dep);
  }

  async function refreshChains() {
    const legs = config.boards.filter(b => b.kind === "chain").flatMap(allLegs);
    await Promise.all([...new Set(legs.flatMap(l => [l.fromId, l.toId]).filter(Boolean))].map(loadPlace));
    const requests = new Map();
    legs.forEach(leg => (legRequests(leg) || []).forEach(r => requests.set(r.key, r)));
    await Promise.all([...requests.values()].map(fetchLegCalls));
  }

  async function refreshAll() {
    const ids = [...new Set(config.boards.filter(b => b.kind !== "chain").map(b => b.stopId).filter(Boolean))];
    await Promise.all([...ids.map(fetchStop), refreshChains()]);
    renderBoards();
  }

  // ---------- boards ----------
  const grid = $(".grid");
  let editing = false;
  let dragId = null;

  function filterSummary(board, entry) {
    const parts = [];
    const stopName = entry?.name || board.stopName;
    if (board.title && stopName) parts.push(stopName);
    if (board.modes.length) parts.push(board.modes.map(m => MODES[m]?.name || m).join(", "));
    if (board.lines.length) parts.push("Linje " + board.lines
      .map(l => board.lineDest[l] ? l + " mot " + board.lineDest[l] : l).join(", "));
    if (board.platforms.length) parts.push("Spor " + board.platforms.join(", "));
    return parts.join(". ");
  }

  function badgeEl(call) {
    const mode = MODES[modeOf(call)];
    const badge = h("span", { class: "badge", title: mode ? mode.name : "", text: call.serviceJourney?.line?.publicCode || "–" });
    badge.style.background = mode ? mode.color : "#4b5563";
    return badge;
  }

  function messageOf(call) {
    const text = (call.situations || [])
      .map(s => (s.summary || []).find(t => t.language === "no" || t.language === "nob") || s.summary?.[0])
      .find(Boolean);
    return text?.value || "";
  }

  function rowEl(call) {
    const expected = new Date(call.expectedDepartureTime);
    const aimed = new Date(call.aimedDepartureTime);
    const minutes = Math.round((expected - now()) / 60000);
    const delayed = expected - aimed >= 60000;

    let time;
    if (call.cancellation) {
      time = h("span", { class: "time cancelled" }, h("span", { text: "Innstilt" }), h("s", { class: "note", text: clock(aimed) }));
    } else {
      const label = minutes <= 0 ? "Nå" : minutes < 10 ? minutes + " min" : clock(expected);
      time = h("span", { class: "time" + (minutes <= 0 ? " now" : "") },
        h("span", { class: "t-main", text: label }),
        delayed ? h("span", { class: "note late", text: "Rute " + clock(aimed) }) : null);
    }

    const message = messageOf(call);

    return h("li", { class: "row" },
      badgeEl(call),
      h("span", { class: "dest" + (call.cancellation ? " is-cancelled" : "") },
        call.destinationDisplay?.frontText || "",
        message ? h("span", { class: "note", text: message }) : null),
      h("span", { class: "plat", text: platformOf(call) || "–" }),
      time);
  }

  function removeButton(board) {
    const button = h("button", { type: "button", class: "tool", text: "Fjern" });
    let timer = null;
    button.addEventListener("click", () => {
      if (!timer) {
        button.textContent = "Fjern tavla?";
        button.classList.add("armed");
        timer = setTimeout(() => { timer = null; button.textContent = "Fjern"; button.classList.remove("armed"); }, 3000);
        return;
      }
      clearTimeout(timer);
      config.boards = config.boards.filter(b => b.id !== board.id);
      saveConfig();
      renderBoards();
    });
    return button;
  }

  function move(index, step) {
    const target = index + step;
    if (target < 0 || target >= config.boards.length) return;
    const [board] = config.boards.splice(index, 1);
    config.boards.splice(target, 0, board);
    saveConfig();
    renderBoards();
    // Keep keyboard focus on the moved board's matching arrow.
    const moved = grid.querySelector(`[data-id="${board.id}"] [data-move="${step}"]`);
    if (moved && !moved.disabled) moved.focus();
  }

  function setupDrag(section, id) {
    section.draggable = true;
    section.addEventListener("dragstart", event => {
      dragId = id;
      section.classList.add("dragging");
      event.dataTransfer.effectAllowed = "move";
      event.dataTransfer.setData("text/plain", id);
    });
    section.addEventListener("dragend", () => { dragId = null; renderBoards(); });
    section.addEventListener("dragover", event => {
      if (!dragId || dragId === id) return;
      event.preventDefault();
      section.classList.add("drop-target");
    });
    section.addEventListener("dragleave", () => section.classList.remove("drop-target"));
    section.addEventListener("drop", event => {
      event.preventDefault();
      if (!dragId || dragId === id) return;
      const from = config.boards.findIndex(b => b.id === dragId);
      const to = config.boards.findIndex(b => b.id === id);
      const [board] = config.boards.splice(from, 1);
      config.boards.splice(to, 0, board);
      saveConfig();
      dragId = null;
      renderBoards();
    });
  }

  function boardShell(board, index, name, sub, meta, ...content) {
    const tools = editing ? h("div", { class: "tools" },
      h("button", { type: "button", class: "tool", "data-move": "-1", "aria-label": "Flytt tavla bakover", title: "Flytt bakover",
        disabled: index === 0, onclick: () => move(index, -1), text: "←" }),
      h("button", { type: "button", class: "tool", "data-move": "1", "aria-label": "Flytt tavla fremover", title: "Flytt fremover",
        disabled: index === config.boards.length - 1, onclick: () => move(index, 1), text: "→" }),
      h("button", { type: "button", class: "tool", text: "Endre",
        onclick: () => board.kind === "chain" ? openChainEditor(board) : openEditor(board) }),
      removeButton(board)) : null;

    const section = h("section", { class: "board" + (board.wide ? " wide" : ""), "data-id": board.id, "aria-label": name },
      h("header", { class: "band" },
        h("div", {}, h("h2", { class: "board-title", text: name }), sub ? h("p", { class: "board-sub", text: sub }) : null),
        tools),
      ...content,
      h("p", { class: "board-meta", text: meta }));

    if (editing) setupDrag(section, board.id);
    return section;
  }

  // "Nå", "4 min" or a clock time; with a walk first, "Gå nå", "Gå om 4 min" or "Gå 12:31".
  function countdown(time, walking) {
    const minutes = Math.round((time - now()) / 60000);
    const label = minutes <= 0 ? "Nå" : minutes < 10 ? (walking ? "om " : "") + minutes + " min" : clock(time);
    return { now: minutes <= 0, label: walking ? "Gå " + (minutes <= 0 ? "nå" : label) : label };
  }

  function legStepEl(leg, option) {
    const { call } = option;
    const aimed = new Date(call.aimedDepartureTime);
    const late = Math.round((option.dep - aimed) / 60000);
    const message = messageOf(call);
    const from = option.fromName || leg.fromName;
    return h("li", { class: "leg-step" },
      badgeEl(call),
      h("span", {},
        h("b", { text: clock(option.dep) }),
        late >= 1 ? h("span", { class: "late", title: "Rutetid " + clock(aimed), text: " +" + late }) : null,
        " " + from + " → ",
        h("b", { text: clock(option.arr) }),
        " " + (option.toName || leg.toName),
        message ? h("span", { class: "note", text: message }) : null),
      h("span", { class: "plat", text: platformOf(call) ? "Spor " + platformOf(call) : "" }));
  }

  // One trip on one route: when to leave home and when you reach the destination, walks included.
  function makeTrip(route, path) {
    const leave = new Date(path[0].dep.getTime() - (route.legs[0].walk || 0) * 60000);
    const arrive = new Date(path.at(-1).arr.getTime() + (route.walkEnd || 0) * 60000);
    return { route, path, leave, arrive };
  }

  const TRIP_ORDER = {
    arrival: (a, b) => a.arrive - b.arrive || a.leave - b.leave,
    departure: (a, b) => a.leave - b.leave || a.arrive - b.arrive,
  };

  function tripEl({ route, path, leave, arrive }) {
    const firstWalk = route.legs[0].walk || 0;
    const when = countdown(leave, firstWalk > 0);
    const total = Math.round((arrive - leave) / 60000);
    const changes = path.length - 1;
    const walks = firstWalk || route.walkEnd || route.legs.some(l => l.walk);

    const steps = [];
    path.forEach((option, i) => {
      if (i > 0) {
        const walk = route.legs[i].walk || 0;
        const wait = Math.round((option.dep - path[i - 1].arr) / 60000) - walk;
        steps.push(h("li", { class: "walk-step",
          text: (walk ? "Gå og bytt, " + walk + " min" : "Bytte") + (wait >= 1 ? " · venter " + wait + " min" : "") }));
      }
      steps.push(legStepEl(route.legs[i], option));
    });
    if (route.walkEnd) {
      steps.push(h("li", { class: "walk-step", text: "Gå " + route.walkEnd + " min til målet, fremme " + clock(arrive) }));
    }

    return h("li", { class: "trip" },
      h("div", { class: "trip-head" },
        h("span", { class: "trip-span" },
          h("b", { text: clock(leave) + " – " + clock(arrive) }),
          h("span", { class: "note", text: total + " min" + (walks ? " med gange" : "")
            + (changes ? " · " + changes + (changes === 1 ? " bytte" : " bytter") : "") })),
        h("span", { class: "time" + (when.now ? " now" : "") }, h("span", { class: "t-main", text: when.label }))),
      h("ol", { class: "trip-legs" }, ...steps));
  }

  function routeSummary(route) {
    const parts = [];
    route.legs.forEach((leg, i) => {
      if (i > 0 && leg.walk) parts.push(leg.walk + " min gange");
      parts.push(leg.lines.length ? leg.lines.join("/") : "alle linjer");
    });
    if (route.walkEnd) parts.push(route.walkEnd + " min gange");
    return parts.join(" → ");
  }

  function chainEl(chain, index) {
    const { routes } = chain;
    const ends = [...new Set(routes.map(r => r.legs.at(-1).toName))];
    const way = routes[0].legs[0].fromName + " → " + ends.join(" / ");
    const name = chain.title || way;
    const sub = (chain.title ? way + ". " : "") + routes.map(routeSummary).join(" eller ")
      + (routes.length > 1 ? ". Sortert etter " + (chain.sort === "departure" ? "avgang" : "ankomst") : "");

    // Routes whose data is in show their trips even while another route is still loading or failing.
    const trips = [];
    const idle = []; // routes with data but no trips, for example while a line is replaced by buses
    let pending = false;
    let failed = false;
    for (const route of routes) {
      const data = route.legs.map(leg => legOptions(leg));
      if (data.some(d => !d.opts)) {
        pending = true;
        failed ||= data.some(d => d.error);
        continue;
      }
      const found = findTrips(route, data.map(d => d.opts));
      if (!found.length) idle.push(route);
      trips.push(...found.map(path => makeTrip(route, path)));
    }
    trips.sort(TRIP_ORDER[chain.sort] || TRIP_ORDER.arrival);
    const shown = trips.slice(0, chain.rows);

    const body = shown.length
      ? h("ol", { class: "rows" }, ...shown.map(tripEl))
      : h("p", { class: "board-msg", text: failed
          ? "Fikk ikke hentet avganger akkurat nå. Prøver igjen om litt."
          : pending ? "Henter avganger …" : "Ingen reiser der overgangene rekker å gå opp de neste timene." });

    // The calls behind every leg, for the "updated at" line.
    const legs = allLegs(chain);
    const entries = legs.flatMap(leg => (legRequests(leg) || []).map(r => legCalls.get(r.key)));
    const error = legs.flatMap(l => [places.get(l.fromId), places.get(l.toId)]).find(p => p?.error)?.error
      || entries.find(e => e?.error)?.error;
    const oldest = !pending && entries.length && entries.every(e => e?.updated)
      ? new Date(Math.min(...entries.map(e => e.updated))) : null;
    const idleNote = routes.length > 1 && idle.length
      ? " Ingen reiser de neste timene med " + idle.map(r => r.legs.map(l => l.lines.join("/") || "alle linjer").join(" → ")).join(" eller ") + "."
      : "";
    const meta = error || (oldest ? "Sanntid fra Entur, oppdatert " + clock(oldest) + "." + idleNote : "");
    return boardShell(chain, index, name, sub, meta, body);
  }

  function boardEl(board, index) {
    if (board.kind === "chain") return chainEl(board, index);
    const entry = stops.get(board.stopId);
    const name = board.title || entry?.name || board.stopName || "Stoppested";
    const sub = filterSummary(board, entry);

    let body;
    let calls = [];
    if (!entry || (!entry.updated && !entry.error)) {
      body = h("p", { class: "board-msg", text: "Henter avganger …" });
    } else {
      const cutoff = now() - 60000;
      calls = entry.calls.filter(c => new Date(c.expectedDepartureTime) >= cutoff && passes(c, board)).slice(0, board.rows);
      body = calls.length
        ? h("ol", { class: "rows" }, ...calls.map(rowEl))
        : h("p", { class: "board-msg", text: entry.error && !entry.calls.length
            ? "Ingen avganger å vise akkurat nå."
            : "Ingen avganger de neste 12 timene med disse filtrene." });
    }

    return boardShell(board, index, name, sub,
      entry?.error || (entry?.updated ? "Sanntid fra Entur, oppdatert " + clock(entry.updated) : ""),
      calls.length ? h("div", { class: "cols", "aria-hidden": "true" },
        h("span", { text: "Linje" }), h("span", { text: "Til" }), h("span", { text: "Spor" }), h("span", { text: "Avgang" })) : null,
      body);
  }

  function renderBoards() {
    if (dragId) return; // don't rebuild under a drag in progress
    const items = config.boards.map(boardEl);
    if (editing) {
      items.push(
        h("button", { type: "button", class: "add-tile", onclick: () => openEditor(null) },
          h("span", { class: "plus", "aria-hidden": "true", text: "+" }), h("span", { text: "Legg til tavle" })),
        h("button", { type: "button", class: "add-tile", onclick: () => openChainEditor(null) },
          h("span", { class: "plus", "aria-hidden": "true", text: "+" }), h("span", { text: "Legg til reise" }),
          h("span", { class: "opt", text: "Flere etapper med bytte" })));
    } else if (!config.boards.length) {
      items.push(h("p", { class: "empty", text: "Ingen tavler ennå. Trykk «Rediger» for å legge til en." }));
    }
    grid.replaceChildren(...items);
  }

  // ---------- header: title, clock, edit mode ----------
  const titleEl = $(".title");
  const editBtn = $(".edit-toggle");
  titleEl.textContent = config.title;
  document.title = config.title;

  titleEl.addEventListener("keydown", event => {
    if (event.key === "Enter") { event.preventDefault(); titleEl.blur(); }
  });
  titleEl.addEventListener("blur", () => {
    config.title = titleEl.textContent.trim() || "Mine avganger";
    titleEl.textContent = config.title;
    document.title = config.title;
    saveConfig();
  });

  editBtn.addEventListener("click", () => {
    editing = !editing;
    document.body.classList.toggle("editing", editing);
    editBtn.textContent = editing ? "Ferdig" : "Rediger";
    editBtn.setAttribute("aria-pressed", String(editing));
    titleEl.contentEditable = editing ? "true" : "false";
    renderBoards();
  });

  function tick() {
    const time = new Date(now());
    $(".clock .hm").textContent = clock(time);
    $(".clock .sec").textContent = ":" + String(time.getSeconds()).padStart(2, "0");
    const date = time.toLocaleDateString("nb-NO", { weekday: "long", day: "numeric", month: "long" });
    $(".date").textContent = date.charAt(0).toUpperCase() + date.slice(1);
  }

  // ---------- stop search (combobox) ----------
  let pickerCount = 0;

  function createStopPicker({ label, onChoose }) {
    const n = ++pickerCount;
    const input = h("input", { id: "stop-input-" + n, type: "text", role: "combobox", "aria-autocomplete": "list",
      "aria-expanded": "false", "aria-controls": "stop-results-" + n, autocomplete: "off", spellcheck: "false",
      placeholder: "Søk etter stasjon eller holdeplass" });
    const list = h("ul", { id: "stop-results-" + n, class: "results", role: "listbox", hidden: true });
    const status = h("p", { class: "hint", role: "status" });
    const box = h("div", { class: "combo-box" }, input, list);
    const el = h("div", { class: "field" }, h("label", { for: input.id, text: label }), box, status);

    let current = "";
    let matches = [];
    let active = -1;
    let timer;
    let seq = 0;

    function close() {
      list.hidden = true;
      input.setAttribute("aria-expanded", "false");
      input.removeAttribute("aria-activedescendant");
      active = -1;
      status.textContent = "";
    }

    function highlight(index) {
      active = index;
      Array.from(list.children).forEach((option, i) => option.setAttribute("aria-selected", String(i === active)));
      if (active >= 0) {
        input.setAttribute("aria-activedescendant", list.children[active].id);
        list.children[active].scrollIntoView({ block: "nearest" });
      } else {
        input.removeAttribute("aria-activedescendant");
      }
    }

    function show() {
      list.replaceChildren(...matches.map((place, index) => {
        const kinds = [...new Set((place.category || []).map(c => MODES[CATEGORY_MODE[c]]?.name).filter(Boolean))];
        const option = h("li", { id: `stop-option-${n}-${index}`, role: "option", "aria-selected": "false" },
          h("span", { text: place.name }),
          h("small", { text: [kinds.join(", "), place.locality].filter(Boolean).join(", ") }));
        option.addEventListener("mousedown", event => event.preventDefault());
        option.addEventListener("click", () => choose(place));
        return option;
      }));
      list.hidden = matches.length === 0;
      input.setAttribute("aria-expanded", String(matches.length > 0));
      highlight(-1);
      status.textContent = matches.length ? "" : "Fant ingen stoppesteder med det navnet.";
    }

    async function search(text) {
      const mine = ++seq;
      try {
        const url = GEOCODER + "?" + new URLSearchParams({ text, layers: "venue", size: "12", lang: "no" });
        const response = await fetch(url, { headers: { "ET-Client-Name": CLIENT_NAME } });
        const json = await response.json();
        if (mine !== seq) return;
        matches = (json.features || [])
          .map(feature => feature.properties)
          .filter(place => place.id && place.id.startsWith("NSR:StopPlace:"));
        show();
      } catch {
        if (mine === seq) status.textContent = "Søket feilet. Sjekk nettforbindelsen og prøv igjen.";
      }
    }

    function choose(place) {
      input.value = current = place.name;
      close();
      onChoose(place);
    }

    function restore() {
      input.value = current;
      seq++;
      close();
    }

    input.addEventListener("focus", () => input.select());
    input.addEventListener("input", () => {
      clearTimeout(timer);
      const text = input.value.trim();
      if (text.length < 2) { seq++; close(); return; }
      timer = setTimeout(() => search(text), 250);
    });
    input.addEventListener("keydown", event => {
      if (event.key === "ArrowDown" || event.key === "ArrowUp") {
        if (list.hidden || !matches.length) return;
        event.preventDefault();
        const step = event.key === "ArrowDown" ? 1 : -1;
        highlight(active < 0 ? (step > 0 ? 0 : matches.length - 1) : (active + step + matches.length) % matches.length);
      } else if (event.key === "Enter" && !list.hidden) {
        event.preventDefault();
        if (active >= 0) choose(matches[active]);
        else if (matches.length === 1) choose(matches[0]);
      } else if (event.key === "Escape" && !list.hidden) {
        event.preventDefault();
        restore();
      }
    });
    input.addEventListener("blur", () => {
      setTimeout(() => { if (document.activeElement !== input && input.isConnected) restore(); }, 150);
    });

    const picker = {
      el, input, restore,
      get open() { return !list.hidden; },
      set(name) { input.value = current = name || ""; seq++; close(); },
    };
    box.picker = picker;
    return picker;
  }

  // Closing on the backdrop, and Escape closing an open stop list before the dialog itself.
  function setupDialog(dialogEl) {
    $('[data-act="cancel"]', dialogEl).addEventListener("click", () => dialogEl.close());
    dialogEl.addEventListener("click", event => { if (event.target === dialogEl) dialogEl.close(); });
    dialogEl.addEventListener("cancel", event => {
      const open = [...dialogEl.querySelectorAll(".combo-box")].map(box => box.picker).filter(p => p?.open);
      if (open.length) { event.preventDefault(); open.forEach(p => p.restore()); }
    });
  }

  // ---------- board editor dialog ----------
  const dialog = $(".editor");
  const heading = $("#editor-heading");
  const titleInput = $("#title-input");
  const rowsSelect = $("#rows-select");
  const widthSelect = $("#width-select");
  const filterHint = $("#filter-hint");
  const saveBtn = $('[data-act="save"]', dialog);
  let draft = null;

  const stopPicker = createStopPicker({ label: "Stoppested", onChoose: place => {
    if (place.id === draft.stopId) return;
    draft.stopId = place.id;
    draft.stopName = place.name;
    draft.lines = [];
    draft.lineDest = {};
    draft.platforms = [];
    saveBtn.disabled = false;
    renderDraftChips();
    loadDraftOptions(place.id);
  } });
  $(".stop-slot", dialog).replaceWith(stopPicker.el);

  const CHIP_KINDS = [
    ["modes", modeOf, v => MODES[v]?.name || v, (a, b) => MODE_ORDER.indexOf(a) - MODE_ORDER.indexOf(b)],
    ["lines", lineCode, v => v, byNatural],
    ["platforms", platformOf, v => v, byNatural],
  ];

  function renderDraftChips() {
    const entry = draft.stopId ? stops.get(draft.stopId) : null;
    const calls = entry?.calls || [];
    for (const [kind, valueOf, labelOf, sort] of CHIP_KINDS) {
      const fieldset = dialog.querySelector(`[data-kind="${kind}"]`);
      const values = new Set(draft[kind]);
      calls.filter(c => passes(c, draft, kind)).forEach(c => { const v = valueOf(c); if (v) values.add(v); });
      const sorted = [...values].sort(sort);
      fieldset.querySelector(".chips").replaceChildren(...sorted.map(value => {
        const on = draft[kind].includes(value);
        return h("button", { type: "button", class: "chip", "aria-pressed": String(on), text: labelOf(value),
          onclick: () => {
            draft[kind] = on ? draft[kind].filter(x => x !== value) : [...draft[kind], value];
            if (kind === "lines" && on) delete draft.lineDest[value];
            renderDraftChips();
          } });
      }));
      fieldset.hidden = sorted.length === 0;
    }
    renderLineDests(calls);
    filterHint.textContent = !draft.stopId
      ? "Velg et stoppested, så kan du filtrere på transport, linjer og spor. Velger du linjer, kan du også velge retning for hver av dem."
      : !entry || (!entry.updated && !entry.error)
        ? "Henter linjer og spor …"
        : entry.error && !calls.length
          ? "Fikk ikke hentet linjer og spor akkurat nå."
          : "Trykk for å velge. Velger du ingen, vises alt.";
  }

  function renderLineDests(calls) {
    const wrap = dialog.querySelector("[data-linedest]");
    const lines = [...draft.lines].sort(byNatural);
    wrap.querySelector(".line-dests").replaceChildren(...lines.map((line, i) => {
      const options = new Set();
      calls.filter(c => lineCode(c) === line && passes(c, draft, "lines")).forEach(c => { const d = destOf(c); if (d) options.add(d); });
      if (draft.lineDest[line]) options.add(draft.lineDest[line]);
      const select = h("select", { id: "ld-" + i },
        h("option", { value: "", text: "Alle retninger" }),
        ...[...options].sort(byNatural).map(d => h("option", { value: d, text: d })));
      select.value = draft.lineDest[line] || "";
      select.addEventListener("change", () => {
        if (select.value) draft.lineDest[line] = select.value;
        else delete draft.lineDest[line];
        renderDraftChips();
      });
      return h("div", { class: "ld-row" }, h("label", { class: "ld-code", for: "ld-" + i, text: line }), select);
    }));
    wrap.hidden = lines.length === 0;
  }

  function loadDraftOptions(id) {
    const entry = stops.get(id);
    if (entry?.updated) return;
    fetchStop(id).then(() => { if (dialog.open && draft?.stopId === id) renderDraftChips(); });
  }

  function openEditor(board) {
    draft = board
      ? { ...board, modes: [...board.modes], lines: [...board.lines], lineDest: { ...board.lineDest }, platforms: [...board.platforms] }
      : newBoard();
    heading.textContent = board ? "Endre tavle" : "Ny tavle";
    saveBtn.textContent = board ? "Lagre endringer" : "Legg til tavle";
    stopPicker.set(draft.stopName || stops.get(draft.stopId)?.name || "");
    titleInput.value = draft.title;
    rowsSelect.value = String(draft.rows);
    widthSelect.value = draft.wide ? "wide" : "normal";
    renderDraftChips();
    saveBtn.disabled = !draft.stopId;
    dialog.showModal();
    if (draft.stopId) loadDraftOptions(draft.stopId);
    else stopPicker.input.focus();
  }

  setupDialog(dialog);

  saveBtn.addEventListener("click", () => {
    if (!draft?.stopId) return;
    draft.title = titleInput.value.trim();
    draft.rows = Number(rowsSelect.value);
    draft.wide = widthSelect.value === "wide";
    const index = config.boards.findIndex(b => b.id === draft.id);
    if (index >= 0) config.boards[index] = draft;
    else config.boards.push(draft);
    saveConfig();
    dialog.close();
    renderBoards();
    if (!stops.get(draft.stopId)?.updated) fetchStop(draft.stopId).then(renderBoards);
  });

  // ---------- travel chain editor dialog ----------
  const chainDialog = $(".chain-editor");
  const chainHeading = $("#chain-heading");
  const chainTitle = $("#chain-title");
  const chainRows = $("#chain-rows");
  const chainWidth = $("#chain-width");
  const chainSort = $("#chain-sort");
  const chainRoutesEl = $(".routes-edit", chainDialog);
  const chainSave = $('[data-act="save"]', chainDialog);
  let chainDraft = null;

  const legComplete = leg => leg.fromId && leg.toId;
  const updateChainSave = () => { chainSave.disabled = !allLegs(chainDraft).every(legComplete); };

  function renderChainRoutes() {
    const several = chainDraft.routes.length > 1;
    chainRoutesEl.replaceChildren(...chainDraft.routes.map((route, r) => {
      const walkEnd = h("input", { id: "walkend-" + route.id, class: "walk-input", type: "number", min: "0", max: "120", step: "1",
        inputmode: "numeric", value: String(route.walkEnd) });
      walkEnd.addEventListener("input", () => { route.walkEnd = Math.max(0, Math.min(120, parseInt(walkEnd.value, 10) || 0)); });
      return h("div", { class: "route-edit", "data-route": route.id },
        several ? h("div", { class: "route-head" },
          h("h3", { text: "Rute " + (r + 1) }),
          h("button", { type: "button", class: "btn ghost small", text: "Fjern rute",
            onclick: () => { chainDraft.routes.splice(r, 1); renderChainRoutes(); } })) : null,
        ...routeLegEls(route),
        h("button", { type: "button", class: "btn add-leg", text: "+ Legg til etappe", onclick: () => {
          const leg = newLeg({ walk: 5 });
          route.legs.push(leg);
          renderChainRoutes();
          $(`[data-leg="${leg.id}"] [role="combobox"]`, chainRoutesEl).focus();
        } }),
        h("div", { class: "field" },
          h("label", { for: walkEnd.id }, "Gangtid fra siste stopp til målet, minutter ",
            h("span", { class: "opt", text: "(valgfritt)" })),
          walkEnd));
    }));
    $("[data-sort]", chainDialog).hidden = !several;
    allLegs(chainDraft).forEach(renderLegChips);
    updateChainSave();
  }

  function routeLegEls(route) {
    return route.legs.map((leg, i) => {
      const from = createStopPicker({ label: "Fra", onChoose: place => setLegStop(leg, "from", place) });
      const to = createStopPicker({ label: "Til", onChoose: place => setLegStop(leg, "to", place) });
      from.set(leg.fromName);
      to.set(leg.toName);
      const walk = h("input", { id: "walk-" + leg.id, class: "walk-input", type: "number", min: "0", max: "120", step: "1",
        inputmode: "numeric", value: String(leg.walk) });
      walk.addEventListener("input", () => { leg.walk = Math.max(0, Math.min(120, parseInt(walk.value, 10) || 0)); });
      return h("div", { class: "leg-edit", "data-leg": leg.id },
        h("div", { class: "leg-edit-head" },
          h("h4", { text: "Etappe " + (i + 1) }),
          route.legs.length > 1 ? h("button", { type: "button", class: "btn ghost small", text: "Fjern etappe",
            onclick: () => { route.legs.splice(i, 1); renderChainRoutes(); } }) : null),
        h("div", { class: "field" },
          h("label", { for: walk.id, text: i === 0 ? "Gangtid til første stopp, minutter" : "Gange og bytte fra forrige etappe, minutter" }),
          walk),
        from.el,
        to.el,
        h("div", { class: "field leg-lines" },
          h("span", { class: "field-label", text: "Linjer" }),
          h("div", { class: "chips" }),
          h("p", { class: "hint" })));
    });
  }

  function setLegStop(leg, end, place) {
    if (leg[end + "Id"] === place.id) return;
    leg[end + "Id"] = place.id;
    leg[end + "Name"] = place.name;
    renderLegChips(leg);
    updateChainSave();
    loadLegOptions(leg);
  }

  // Line chips list every line that serves both ends of the leg, from Entur's route data, so lines
  // that only run at other times of day are there too. Chosen lines that no longer fit are dropped.
  function renderLegChips(leg) {
    const box = chainRoutesEl.querySelector(`[data-leg="${leg.id}"] .leg-lines`);
    if (!box) return;
    let codes = new Set(leg.lines);
    let hint;
    if (!legComplete(leg)) {
      hint = "Velg fra og til, så ser du hvilke linjer som går direkte mellom dem.";
    } else {
      const failed = [places.get(leg.fromId), places.get(leg.toId)].some(p => p?.error);
      const lines = legLines(leg, true);
      if (failed) hint = "Fikk ikke hentet linjer akkurat nå.";
      else if (!lines) hint = "Henter linjer …";
      else {
        codes = new Set(lines.values());
        leg.lines = leg.lines.filter(code => codes.has(code));
        hint = codes.size
          ? "Trykk for å velge. Velger du ingen, brukes alle linjene som går hit. Stopp innen " + NEARBY_M + " meter regnes med, for eksempel Jernbanetorget ved Oslo S."
          : "Fant ingen linjer som går direkte mellom disse stoppestedene.";
      }
    }
    box.querySelector(".chips").replaceChildren(...[...codes].sort(byNatural).map(code => {
      const on = leg.lines.includes(code);
      return h("button", { type: "button", class: "chip", "aria-pressed": String(on), text: code,
        onclick: () => { leg.lines = on ? leg.lines.filter(x => x !== code) : [...leg.lines, code]; renderLegChips(leg); } });
    }));
    box.querySelector(".hint").textContent = hint;
  }

  async function loadLegOptions(leg) {
    await Promise.all([leg.fromId, leg.toId].filter(Boolean).map(loadPlace));
    if (chainDialog.open) renderLegChips(leg);
  }

  function openChainEditor(chain) {
    chainDraft = chain ? newChain(JSON.parse(JSON.stringify(chain))) : newChain();
    chainHeading.textContent = chain ? "Endre reise" : "Ny reise";
    chainSave.textContent = chain ? "Lagre endringer" : "Legg til reise";
    chainTitle.value = chainDraft.title;
    chainRows.value = String(chainDraft.rows);
    chainWidth.value = chainDraft.wide ? "wide" : "normal";
    chainSort.value = chainDraft.sort;
    renderChainRoutes();
    chainDialog.showModal();
    allLegs(chainDraft).forEach(loadLegOptions);
    if (!chain) $('[role="combobox"]', chainRoutesEl).focus();
  }

  setupDialog(chainDialog);

  $(".add-route", chainDialog).addEventListener("click", () => {
    const route = newRoute();
    chainDraft.routes.push(route);
    renderChainRoutes();
    $(`[data-route="${route.id}"] [role="combobox"]`, chainRoutesEl).focus();
  });

  chainSave.addEventListener("click", () => {
    if (!chainDraft || !allLegs(chainDraft).every(legComplete)) return;
    chainDraft.sort = chainSort.value;
    chainDraft.title = chainTitle.value.trim();
    chainDraft.rows = Number(chainRows.value);
    chainDraft.wide = chainWidth.value === "wide";
    const index = config.boards.findIndex(b => b.id === chainDraft.id);
    if (index >= 0) config.boards[index] = chainDraft;
    else config.boards.push(chainDraft);
    saveConfig();
    chainDialog.close();
    renderBoards();
    refreshAll();
  });

  // ---------- GitHub button ----------
  function findRepoUrl() {
    if (REPO_URL) return REPO_URL;
    const pages = location.hostname.match(/^([^.]+)\.github\.io$/i);
    if (!pages) return "";
    const first = location.pathname.split("/").filter(Boolean)[0];
    const repo = first && !first.includes(".") ? first : pages[1] + ".github.io";
    return "https://github.com/" + pages[1] + "/" + repo;
  }
  const repoLink = $(".repo-link");
  const repoUrl = findRepoUrl();
  if (repoUrl) {
    repoLink.href = repoUrl;
    repoLink.hidden = false;
  }

  // ---------- start ----------
  if (DAY_OFFSET) {
    const banner = $(".test-mode");
    banner.textContent = "Testmodus: " + DAY_OFFSET + (DAY_OFFSET === 1 ? " dag" : " dager")
      + " frem i tid, med rutetider. Fjern ?nday fra adressen for sanntid.";
    banner.hidden = false;
  }
  tick();
  setInterval(tick, 1000);
  renderBoards();
  refreshAll();
  setInterval(() => { if (!document.hidden) refreshAll(); }, REFRESH_MS);
  setInterval(() => { if (!document.hidden) renderBoards(); }, 15000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refreshAll(); });
})();
</script>
</body>
</html>
